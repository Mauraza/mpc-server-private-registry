apiVersion: v1
kind: Service
metadata:
  name: {{ include "private-registry-mcp.fullname" . }}
  labels:
    {{- include "private-registry-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: private-registry-mcp
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
