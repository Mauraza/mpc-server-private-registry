name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/private-registry-mcp --set registry.url=https://registry.example --set registry.username=robot --set registry.existingSecret=registry-creds --set auth.existingSecret=mcp-auth
      - run: bash charts/private-registry-mcp/tests/render.sh
